name: Deploy

# Builds the static site and uploads it to the pawa-site Worker (pawa.siki.moe).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts and Workers Routes edit).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - tools/**
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pawa.siki.moe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://pawa.siki.moe/ | grep -q "PAWA"
