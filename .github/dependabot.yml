# Weekly dependency updates. Minor and patch bumps are grouped into one PR per ecosystem and
# merged automatically once CI passes (see the automerge job in workflows/ci.yml); majors stay
# open for review.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # astro check does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Biome minors rename rules; stay on the line the installed ultracite preset targets
      # and bump both together by hand.
      - dependency-name: "@biomejs/biome"
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
